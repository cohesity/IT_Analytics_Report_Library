title: IT Analytics Report Library
description: >-
  Community-contributed report templates for Veritas/Cohesity IT Analytics
  (formerly APTARE). Browse by product or category, view a sample of each
  report's output, and download the template to import into your portal.
baseurl: "/report-library-site"
url: "https://ebergan-cohesity.github.io"
github_repo: "ebergan-cohesity/report-library-site"

collections:
  reports:
    output: true
    permalink: /reports/:path/
  products:
    output: true
    permalink: /products/:path/
  categories:
    output: true
    permalink: /categories/:path/

defaults:
  - scope:
      path: ""
      type: reports
    values:
      layout: report
  - scope:
      path: ""
      type: products
    values:
      layout: product
  - scope:
      path: ""
      type: categories
    values:
      layout: category
  - scope:
      path: ""
    values:
      layout: default

markdown: kramdown
plugins:
  - jekyll-feed
  - jekyll-sitemap

exclude:
  - export/
  - descriptions/
  - scripts/
  - README.md
  - ADMIN.md
  - "*.gemspec"
  - Gemfile.lock
  - ruby_compat_shim.rb
